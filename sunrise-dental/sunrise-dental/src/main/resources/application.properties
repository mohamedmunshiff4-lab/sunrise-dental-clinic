# Sunrise Dental Clinic Management System - Configuration
# XAMPP MySQL (phpMyAdmin) connection
spring.datasource.url=jdbc:mysql://localhost:3306/sunrise_dental?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console disabled when using MySQL
spring.h2.console.enabled=false

spring.thymeleaf.cache=false
server.port=8080

# NOTE: tables are created automatically by JPA (ddl-auto=update).
# database.sql is provided to create/inspect the schema manually in
# phpMyAdmin - useful for coursework demonstration.
