<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Search - Sunrise Dental Clinic</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div class="navbar" th:if="${session.staff != null}">
  <span class="brand">&#129463; Sunrise Dental</span>
  <a th:href="@{/dashboard}">Dashboard</a>
  <a th:href="@{/register}">Register Appointment</a>
  <a th:href="@{/search}">Search</a>
  <a th:href="@{/bill}">Billing</a>
  <a th:href="@{/reports}">Reports</a>
  <a th:href="@{/help}">Help</a>
  <span class="right"></span>
  <a th:href="@{/logout}">Logout (<span th:text="${session.staff.username}"></span>)</a>
</div>

<div class="container">
  <h1>Display Appointment Details</h1>
  <div class="error" th:if="${error}" th:text="${error}"></div>
  <form method="get" action="/search/result">
    <label>Appointment Number</label>
    <input type="text" name="appointmentNo" placeholder="e.g. APT-2024-0001" required
           th:value="${param.appointmentNo}">
    <button type="submit">Search</button>
  </form>

  <div th:if="${appointment != null}">
    <h2>Appointment <span class="mono" th:text="${appointment.appointmentNo}"></span></h2>
    <table>
      <tr><th style="width:220px">Field</th><th>Value</th></tr>
      <tr><td>Patient Name</td><td th:text="${appointment.patient.name}"></td></tr>
      <tr><td>Address</td><td th:text="${appointment.patient.address}"></td></tr>
      <tr><td>Contact Number</td><td th:text="${appointment.patient.contactNo}"></td></tr>
      <tr><td>Dentist</td><td th:text="${appointment.dentist.name}"></td></tr>
      <tr><td>Treatment Type</td><td th:text="${appointment.treatmentType.name}"></td></tr>
      <tr><td>Appointment Date</td><td th:text="${appointment.date}"></td></tr>
      <tr><td>Appointment Time</td><td th:text="${appointment.time}"></td></tr>
      <tr><td>Status</td><td th:text="${appointment.status}"></td></tr>
      <tr><td>Treatment Cost</td><td th:text="'Rs. ' + ${appointment.treatmentType.cost}"></td></tr>
    </table>
    <a class="btn" style="display:inline-block; text-decoration:none"
       th:href="@{/bill(appointmentNo=${appointment.appointmentNo})}">Go to Billing</a>
  </div>
</div>

</body>
</html>
