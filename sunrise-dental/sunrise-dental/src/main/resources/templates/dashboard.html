<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Sunrise Dental Clinic</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div class="navbar" th:if="${session.staff != null}">
  <span class="brand">&#129463; Sunrise Dental</span>
  <a th:href="@{/dashboard}">Dashboard</a>
  <a th:href="@{/register}">Register Appointment</a>
  <a th:href="@{/search}">Search</a>
  <a th:href="@{/bill}">Billing</a>
  <a th:href="@{/reports}">Reports</a>
  <a th:href="@{/help}">Help</a>
  <span class="right"></span>
  <a th:href="@{/logout}">Logout (<span th:text="${session.staff.username}"></span>)</a>
</div>

<div class="container">
  <h1>Dashboard</h1>
  <div class="success" th:if="${success}" th:text="${success}"></div>
  <h2>Today's Appointments (<span th:text="${#temporals.format(report.date, 'dd MMM yyyy')}"></span>)</h2>
  <p th:if="${#lists.isEmpty(today)}">No appointments scheduled for today.</p>
  <table th:if="${!#lists.isEmpty(today)}">
    <tr><th>Time</th><th>Appointment No</th><th>Patient</th><th>Dentist</th><th>Treatment</th><th>Status</th></tr>
    <tr th:each="a : ${today}">
      <td th:text="${a.time}"></td>
      <td class="mono" th:text="${a.appointmentNo}"></td>
      <td th:text="${a.patient.name}"></td>
      <td th:text="${a.dentist.name}"></td>
      <td th:text="${a.treatmentType.name}"></td>
      <td th:text="${a.status}"></td>
    </tr>
  </table>
  <h2>Quick Stats</h2>
  <p>Revenue today: <b>Rs. <span th:text="${#numbers.formatDecimal(report.dayRevenue, 1, 2)}"></span></b> |
     Scheduled: <b th:text="${report.scheduledCount}"></b> |
     Completed: <b th:text="${report.completedCount}"></b></p>
</div>

</body>
</html>
